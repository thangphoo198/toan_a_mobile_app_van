org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Tat incremental compilation cua Kotlin: bug da biet tren Windows khi
# project (o dia E:) va Pub cache (o dia C:) khac o dia - trinh bien dich co
# gang tinh duong dan tuong doi giua 2 file khac "root" (khac o dia) va nem
# IllegalArgumentException "this and base files have different roots" ngay
# luc dong incremental cache. Tat incremental (build cham hon mot chut,
# khong anh huong ket qua) de tranh loi nay hoan toan.
kotlin.incremental=false
