name: iOS Build & TestFlight

# Chi chay THU CONG (nut "Run workflow" tren tab Actions cua GitHub) - macOS
# runner ton phi tren rat nhieu phut so voi Linux/Windows, nen KHONG de tu
# dong chay tren moi push/PR.
on:
  workflow_dispatch: {}

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # [SIGNING] Import certificate (.p12) va provisioning profile vao may
      # ao macOS - mau chuan cua GitHub cho iOS code signing khong dung
      # fastlane match. Tao 1 keychain TAM THOI rieng cho lan chay nay
      # (khong dung login keychain mac dinh) - tu huy khi runner bi xoa sau
      # khi job xong, khong de lai dau vet giua cac lan chay.
      - name: Import signing certificate & provisioning profile
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"

          echo -n "$P12_BASE64" | base64 --decode -o "$RUNNER_TEMP/certificate.p12"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$RUNNER_TEMP/profile.mobileprovision"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A \
            -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          mkdir -p ~/Library/MobileDevice/"Provisioning Profiles"
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/"Provisioning Profiles"/

      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 30

      # Giai ma API key tu base64 (secret luu base64 de tranh loi khi dan
      # noi dung nhieu dong vao GitHub Secrets) truoc khi dua vao action.
      - name: Decode App Store Connect API key
        id: asc_key
        env:
          KEY_BASE64: ${{ secrets.IOS_ASC_API_KEY_BASE64 }}
        run: |
          echo -n "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo 'key<<EOF_ASC_KEY'
            cat "$RUNNER_TEMP/AuthKey.p8"
            echo ""
            echo 'EOF_ASC_KEY'
          } >> "$GITHUB_OUTPUT"

      - name: Find built IPA path
        id: find_ipa
        run: echo "path=$(ls build/ios/ipa/*.ipa)" >> "$GITHUB_OUTPUT"

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: ${{ steps.find_ipa.outputs.path }}
          issuer-id: ${{ secrets.IOS_ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.IOS_ASC_KEY_ID }}
          api-private-key: ${{ steps.asc_key.outputs.key }}
